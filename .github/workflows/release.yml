name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-13
          - os: macos-14
          - os: windows-2022
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: |
          npm install
        working-directory: .

      - name: Build Tauri app
        run: |
          npm run tauri build
        working-directory: .

      - name: Prepare Linux binary
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/release
          tar -czvf gochat-${{ github.ref_name }}-linux-x64.tar.gz gochat

      - name: Prepare macOS binary (Intel)
        if: matrix.os == 'macos-13'
        run: |
          cd src-tauri/target/release
          zip -r gochat-${{ github.ref_name }}-macos-x64.zip GoChat.app

      - name: Prepare macOS binary (ARM)
        if: matrix.os == 'macos-14'
        run: |
          cd src-tauri/target/release
          zip -r gochat-${{ github.ref_name }}-macos-arm64.zip GoChat.app

      - name: Prepare Windows binary
        if: matrix.os == 'windows-2022'
        run: |
          cd src-tauri/target/release
          7z a gochat-${{ github.ref_name }}-windows-x64.zip GoChat.exe

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/gochat-*-linux-x64.tar.gz
            src-tauri/target/release/gochat-*-macos-*.zip
            src-tauri/target/release/gochat-*-windows-*.zip
          tag_name: ${{ github.ref_name }}
          body: |
            See [docs/auto-update.md](docs/auto-update.md) for release process documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
